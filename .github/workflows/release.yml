name: Release Sub2API Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable tag to publish (for example, v0.1.165-ext.1)'
        required: true
        type: string

concurrency:
  group: release-sub2api-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ryanpenn/sub2api

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      fork_version: ${{ steps.version.outputs.fork_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      source_date: ${{ steps.version.outputs.source_date }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Resolve and validate fork version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "ryanpenn/sub2api" ]]; then
            echo "This release workflow is restricted to ryanpenn/sub2api" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from the reviewed main branch, got: $GITHUB_REF" >&2
            exit 1
          fi

          UPSTREAM_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          EXT_VERSION=$(tr -d '\r\n' < backend/extends/VERSION)

          if [[ ! "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream VERSION: $UPSTREAM_VERSION" >&2
            exit 1
          fi
          if [[ ! "$EXT_VERSION" =~ ^ext\.([1-9][0-9]*)$ ]]; then
            echo "Invalid extends VERSION: $EXT_VERSION" >&2
            exit 1
          fi

          EXT_REVISION=${BASH_REMATCH[1]}
          FORK_VERSION="${UPSTREAM_VERSION}-${EXT_VERSION}"
          EXPECTED_TAG="v${FORK_VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag must be $EXPECTED_TAG, got $RELEASE_TAG" >&2
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          SOURCE_COMMIT=$(git rev-parse HEAD)
          if [[ "$TAG_COMMIT" != "$SOURCE_COMMIT" ]]; then
            echo "Checkout commit $SOURCE_COMMIT does not match $RELEASE_TAG ($TAG_COMMIT)" >&2
            exit 1
          fi

          MAX_EXT_REVISION=0
          while IFS= read -r EXISTING_TAG; do
            [[ -z "$EXISTING_TAG" || "$EXISTING_TAG" == "$RELEASE_TAG" ]] && continue
            if [[ "$EXISTING_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ext\.([1-9][0-9]*)$ ]]; then
              EXISTING_REVISION=${BASH_REMATCH[1]}
              if (( EXISTING_REVISION > MAX_EXT_REVISION )); then
                MAX_EXT_REVISION=$EXISTING_REVISION
              fi
            fi
          done < <(git tag --list 'v*-ext.*')

          if (( EXT_REVISION <= MAX_EXT_REVISION )); then
            echo "extends revision ext.$EXT_REVISION is not newer than ext.$MAX_EXT_REVISION" >&2
            exit 1
          fi

          git diff --exit-code
          SOURCE_DATE=$(git show -s --format=%cI HEAD)
          {
            echo "fork_version=$FORK_VERSION"
            echo "release_tag=$RELEASE_TAG"
            echo "source_commit=$SOURCE_COMMIT"
            echo "source_date=$SOURCE_DATE"
          } >> "$GITHUB_OUTPUT"

  preflight:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package is private or absent before push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/users/ryanpenn/packages/container/sub2api
          )
          case "$status" in
            200)
              visibility=$(jq -r '.visibility // empty' "$response_file")
              if [[ "$visibility" != "private" ]]; then
                echo "GHCR package visibility must be private before push, got: $visibility" >&2
                exit 1
              fi
              ;;
            404)
              echo "GHCR package does not exist; first publication must create it private"
              ;;
            *)
              echo "Unable to verify GHCR package visibility (HTTP $status)" >&2
              exit 1
              ;;
          esac

      - name: Refuse a completed or conflicting release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing multi-architecture tag: $IMAGE:$RELEASE_TAG" >&2
            exit 1
          fi
          for suffix in amd64 arm64; do
            if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG-$suffix" >/dev/null 2>&1; then
              echo "Found partial-release tag; publish will require an exact digest match: $IMAGE:$RELEASE_TAG-$suffix"
            fi
          done

  build:
    needs: [resolve-version, preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.release_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by content digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.fork_version }}
            COMMIT=${{ needs.resolve-version.outputs.source_commit }}
            DATE=${{ needs.resolve-version.outputs.source_date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.fork_version }}
            org.opencontainers.image.revision=${{ needs.resolve-version.outputs.source_commit }}

      - name: Record architecture digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          test "$DIGEST" != ""
          mkdir -p "$RUNNER_TEMP/sub2api-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/sub2api-digests/$SUFFIX.digest"

      - name: Upload architecture digest
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/sub2api-digests/${{ matrix.suffix }}.digest
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed release helper
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.release_tag }}

      - name: Download architecture digests
        uses: actions/download-artifact@v8
        with:
          pattern: sub2api-digest-*
          path: ${{ runner.temp }}/sub2api-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package remains private
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility=$(gh api /users/ryanpenn/packages/container/sub2api --jq .visibility)
          if [[ "$visibility" != "private" ]]; then
            echo "GHCR package visibility must be private, got: $visibility" >&2
            exit 1
          fi

      - name: Promote immutable tags and record evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          amd64_digest=$(<"$RUNNER_TEMP/sub2api-digests/amd64.digest")
          arm64_digest=$(<"$RUNNER_TEMP/sub2api-digests/arm64.digest")
          deploy/cluster/promote-ghcr-manifests.sh \
            "$IMAGE" \
            "$RELEASE_TAG" \
            "$amd64_digest" \
            "$arm64_digest" \
            | tee release-evidence.txt
          {
            echo '```text'
            cat release-evidence.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-${{ needs.resolve-version.outputs.release_tag }}-evidence
          path: release-evidence.txt
          if-no-files-found: error
          retention-days: 90
